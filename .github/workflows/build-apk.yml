name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          cp -r www android/app/src/main/assets/public
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: compass-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sanin-compass.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" sanin-compass.apk --title "山陰コンパス $TAG" --notes "スマホでこのページを開き、sanin-compass.apk をタップしてインストール" --latest
